worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression for faster page loads
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # Rate limiting zone (basic DDoS protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream backend (FastAPI / Uvicorn)
    upstream fastapi_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 3000;
        server_name localhost;

        # ── Serve static frontend (Vite build output) ──────────────
        root /usr/share/nginx/html;
        index index.html;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── API reverse proxy ──────────────────────────────────────
        # All /api/* requests are forwarded to the FastAPI backend.
        # The /api prefix is STRIPPED before forwarding.
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://fastapi_backend/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts for long-running API calls (PDF generation, etc.)
            proxy_read_timeout  120s;
            proxy_send_timeout  120s;
            proxy_connect_timeout 10s;

            # Disable buffering for streaming responses (PDF receipts)
            proxy_buffering off;
        }

        # ── Static asset caching ───────────────────────────────────
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA fallback ──────────────────────────────────────────
        # For React Router: any non-file, non-API request returns index.html
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
